<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Pulse</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .lang-buttons {
            margin-bottom: 30px;
        }
        .lang-btn {
            background-color: #334155;
            color: #ffffff;
            border: 1px solid #38bdf8;
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        .lang-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        h1 {
            color: #38bdf8;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="lang-buttons">
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" onclick="setLanguage('ar')">العربية</button>
        <button class="lang-btn" onclick="setLanguage('fr')">Français</button>
    </div>

    <h1 id="title">Welcome to Apex Pulse</h1>
    <p id="description">Website is currently under construction!</p>

    <script>
        const translations = {
            en: {
                title: "Welcome to Apex Pulse",
                description: "Website is currently under construction!",
                dir: "ltr"
            },
            ar: {
                title: "مرحباً بك في Apex Pulse",
                description: "الموقع قيد الإنشاء والبرمجة حالياً!",
                dir: "rtl"
            },
            fr: {
                title: "Bienvenue sur Apex Pulse",
                description: "Le site web est actuellement en construction !",
                dir: "ltr"
            }
        };

        function setLanguage(lang) {
            document.getElementById('title').textContent = translations[lang].title;
            document.getElementById('description').textContent = translations[lang].description;
            document.documentElement.dir = translations[lang].dir;
            document.documentElement.lang = lang;
        }
    </script>

</body>
          </html>
